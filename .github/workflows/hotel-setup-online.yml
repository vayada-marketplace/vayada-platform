name: Automatic internal hotel setup

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: production-ecs-mutations
  queue: max

jobs:
  environment-check:
    if: github.repository == 'vayada-marketplace/vayada-platform' && github.ref == 'refs/heads/main' && vars.HOTEL_SETUP_AUTOMATIC_PROVISIONING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Check before entering the environment, so an unsafe configuration cannot
      # put the scheduled job behind a human approval or waiting period.
      - &machine_environment
        name: Verify fixed machine environment (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          HOTEL_SETUP_AUTOMATIC_PROVISIONING_ENABLED: ${{ vars.HOTEL_SETUP_AUTOMATIC_PROVISIONING_ENABLED }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              if (os.environ.get('GITHUB_REPOSITORY') != 'vayada-marketplace/vayada-platform'
                      or os.environ.get('GITHUB_REF') != 'refs/heads/main'
                      or os.environ.get('HOTEL_SETUP_AUTOMATIC_PROVISIONING_ENABLED') != 'true'):
                  raise ValueError()
              name = 'hotel-setup-automatic-provisioning'
              base = 'https://api.github.com/repos/vayada-marketplace/vayada-platform/environments/' + name
              def get(suffix=''):
                  request = urllib.request.Request(base + suffix, headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }, method='GET')
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200 or response.geturl() != base + suffix:
                          raise ValueError()
                      return json.loads(response.read(262145))
              environment = get()
              if (environment.get('name') != name or not isinstance(environment.get('id'), int)
                      or environment.get('deployment_branch_policy') != {
                          'protected_branches': False, 'custom_branch_policies': True}):
                  raise ValueError()
              rules = environment['protection_rules']
              if not isinstance(rules, list) or any(rule.get('type') != 'branch_policy' for rule in rules):
                  raise ValueError()
              branches = get('/deployment-branch-policies?per_page=100')
              policies = branches['branch_policies']
              if (branches.get('total_count') != 1 or len(policies) != 1
                      or policies[0].get('name') != 'main' or policies[0].get('type') != 'branch'):
                  raise ValueError()
              custom = get('/deployment_protection_rules')
              if custom.get('total_count') != 0 or custom.get('custom_deployment_protection_rules') != []:
                  raise ValueError()
          except Exception:
              raise SystemExit('Automatic setup environment is unavailable or requires approval; no AWS authentication') from None
          print('Fixed main-only machine environment verified')
          PY

  provision:
    needs: environment-check
    if: github.repository == 'vayada-marketplace/vayada-platform' && github.ref == 'refs/heads/main' && vars.HOTEL_SETUP_AUTOMATIC_PROVISIONING_ENABLED == 'true'
    environment: hotel-setup-automatic-provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - *machine_environment
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-hotel-setup-online
          aws-region: eu-west-1
      - name: Prepare shared creation credentials
        run: python3 scripts/run-hotel-setup-online.py --mode organization
      - name: Prepare committed Hotel Operations properties
        run: python3 scripts/run-hotel-setup-online.py --mode property
