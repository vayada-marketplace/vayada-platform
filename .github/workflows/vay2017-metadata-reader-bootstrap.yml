name: VAY-2017 Metadata Reader Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vay2017-metadata-runner
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vay2017-metadata-preflight
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-vay2017-metadata
          aws-region: eu-west-1

      - name: Provision fixed metadata-only login
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/run-vay2017-metadata-reader-bootstrap.sh
