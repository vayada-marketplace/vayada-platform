name: Read protected hotel setup ledger and automatic authority

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed ledger diagnostic, readiness transition or automatic grant authority
        type: choice
        options: [failed_0441, readiness_0463_0464, automatic_authority]
        default: failed_0441
        required: true
      image_digest:
        description: Reviewed operational image digest
        required: true
      expected_task_definition:
        description: Exact stable public task after captured-task recovery
        required: true

permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-mutations
  queue: max
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Read only the selected fixed audit
        env:
          AUDIT_MODE: ${{ inputs.mode }}
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          case "$AUDIT_MODE" in
            failed_0441) mode=--audit-hotel-setup-migration ;;
            readiness_0463_0464) mode=--audit-hotel-setup-readiness-migrations ;;
            automatic_authority) mode=--audit-hotel-setup-automatic-authority ;;
            *) exit 2 ;;
          esac
          bash scripts/run-target-database-runtime-preflight.sh "$mode" "$IMAGE_DIGEST"
