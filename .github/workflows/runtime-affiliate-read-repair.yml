name: Repair missing affiliate runtime reads

on:
  workflow_dispatch:
    inputs:
      expected_task_definition:
        description: "Reviewed stable next API task definition ARN"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ecs-mutations
  queue: max

env:
  AWS_REGION: eu-west-1

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Require the reviewed stable API before any grant
        env:
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster vayada-backend-cluster \
            --services vayada-next-api-service --region "$AWS_REGION" \
            --query 'services[0]' --output json > service.json
          jq -e --arg expected "$EXPECTED_TASK" '
            .taskDefinition == $expected and .desiredCount == 1 and
            .runningCount == 1 and .pendingCount == 0 and
            (.deployments | length) == 1 and
            .deployments[0].rolloutState == "COMPLETED"
          ' service.json >/dev/null
          aws ecs describe-task-definition --task-definition "$EXPECTED_TASK" \
            --region "$AWS_REGION" --query taskDefinition --output json > definition.json
          jq -e '[.containerDefinitions[] | select(.name == "vayada-next-api") |
            .secrets[] | select(.name == "TARGET_DATABASE_URL") | .valueFrom] as $mapping |
            $mapping == ["/vayada/prod/target-database-runtime-url"] or
            $mapping == ["arn:aws:ssm:eu-west-1:269416271598:parameter/vayada/prod/target-database-runtime-url"]' definition.json >/dev/null
      - name: Require only the two known missing affiliate reads
        run: |
          set -euo pipefail
          if bash scripts/run-target-database-runtime-preflight.sh > preflight.log 2>&1; then
            echo "Runtime preflight already passes; no grant needed."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          failures = re.findall(r'^runtime_relation_read_missing:2:([^\r\n]+)$',
                                Path('preflight.log').read_text(), re.MULTILINE)
          expected = {'marketplace.affiliate_discrepancy_claims',
                      'marketplace.affiliate_discrepancy_resolutions'}
          if len(failures) != 1 or set(failures[0].split(',')) != expected:
              raise SystemExit('Runtime state differs from the reviewed two-read repair; no grant made.')
          PY
      - name: Apply the fixed owner-checked SELECT grants
        run: bash scripts/run-target-database-runtime-preflight.sh --grant-affiliate-read
      - name: Verify the complete runtime boundary
        run: bash scripts/run-target-database-runtime-preflight.sh

      # No automatic retry, Terraform apply, service deployment or feature activation.
