name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "scripts/roll-forward-auth-gateways.sh"
      - "scripts/smoke-auth-gateway.sh"
      - "scripts/assert-terraform-protected-resources.sh"
      - "scripts/guard-finance-folio-kms-plan.sh"
      - ".github/workflows/tf-apply.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed VAY-1381 targeted plan"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ inputs.apply && 'production-ecs-mutations' || 'vay1381-plan-only' }}
  queue: max

env:
  AWS_REGION: eu-west-1

jobs:
  vay1381-targeted:
    if: github.event_name == 'workflow_dispatch'
    name: VAY-1381 targeted ${{ inputs.apply && 'apply' || 'plan' }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_db_master_password: ${{ secrets.TF_VAR_DB_MASTER_PASSWORD }}
      TF_VAR_db_booking_password: ${{ secrets.TF_VAR_DB_BOOKING_PASSWORD }}
      TF_VAR_db_pms_password: ${{ secrets.TF_VAR_DB_PMS_PASSWORD }}
      TF_VAR_db_auth_password: ${{ secrets.TF_VAR_DB_AUTH_PASSWORD }}
      TF_VAR_jwt_secret_key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}
      TF_VAR_smtp_username: ${{ secrets.TF_VAR_SMTP_USERNAME }}
      TF_VAR_smtp_password: ${{ secrets.TF_VAR_SMTP_PASSWORD }}
      TF_VAR_resend_api_key: ${{ secrets.TF_VAR_RESEND_API_KEY }}
      TF_VAR_resend_webhook_secret: ${{ secrets.TF_VAR_RESEND_WEBHOOK_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
      TF_VAR_next_stripe_test_secret_key: ${{ secrets.TF_VAR_NEXT_STRIPE_TEST_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.TF_VAR_STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.TF_VAR_STRIPE_CONNECT_WEBHOOK_SECRET }}
      TF_VAR_stripe_platform_account_id: ${{ secrets.TF_VAR_STRIPE_PLATFORM_ACCOUNT_ID }}
      TF_VAR_legacy_booking_api_desired_count: ${{ secrets.TF_VAR_LEGACY_BOOKING_API_DESIRED_COUNT || '1' }}
      TF_VAR_legacy_marketplace_api_desired_count: ${{ secrets.TF_VAR_LEGACY_MARKETPLACE_API_DESIRED_COUNT || '1' }}
      TF_VAR_legacy_pms_api_desired_count: ${{ secrets.TF_VAR_LEGACY_PMS_API_DESIRED_COUNT || '1' }}
      TF_VAR_enable_staging_pms_runtime: ${{ secrets.TF_VAR_ENABLE_STAGING_PMS_RUNTIME || 'false' }}
      TF_VAR_staging_pms_database_url: ${{ secrets.TF_VAR_STAGING_PMS_DATABASE_URL }}
      TF_VAR_staging_pms_auth_database_url: ${{ secrets.TF_VAR_STAGING_PMS_AUTH_DATABASE_URL }}
      TF_VAR_staging_pms_booking_engine_database_url: ${{ secrets.TF_VAR_STAGING_PMS_BOOKING_ENGINE_DATABASE_URL }}
      TF_VAR_target_database_url: ${{ secrets.TF_VAR_TARGET_DATABASE_URL }}
      TF_VAR_workos_api_key: ${{ secrets.TF_VAR_WORKOS_API_KEY }}
      TF_VAR_workos_webhook_secret: ${{ secrets.TF_VAR_WORKOS_WEBHOOK_SECRET }}
      TF_VAR_workos_client_id: ${{ secrets.TF_VAR_WORKOS_CLIENT_ID }}
      TF_VAR_workos_audience: ${{ secrets.TF_VAR_WORKOS_AUDIENCE }}
      TF_VAR_workos_issuer: ${{ secrets.TF_VAR_WORKOS_ISSUER }}
      TF_VAR_workos_jwks_url: ${{ secrets.TF_VAR_WORKOS_JWKS_URL }}
      TF_VAR_auth_cookie_secret: ${{ secrets.TF_VAR_AUTH_COOKIE_SECRET }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
      TF_VAR_enable_cloudflare_dns: ${{ secrets.TF_VAR_ENABLE_CLOUDFLARE_DNS || 'false' }}
      TF_VAR_channex_api_key: ${{ secrets.TF_VAR_CHANNEX_API_KEY }}
      TF_VAR_anthropic_api_key: ${{ secrets.TF_VAR_ANTHROPIC_API_KEY }}
      TF_VAR_firecrawl_api_key: ${{ secrets.TF_VAR_FIRECRAWL_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform init
        run: terraform init
        working-directory: infra

      - name: Terraform targeted plan
        run: |
          terraform plan -no-color \
            -target='aws_ssm_parameter.secrets["resend-webhook-secret"]' \
            -target='aws_ecs_task_definition.services["next-target-backend"]' \
            -out=tfplan
          terraform show -no-color tfplan
        working-directory: infra

      - name: Guard Terraform apply phase
        run: bash ../scripts/guard-finance-folio-kms-plan.sh tfplan apply
        working-directory: infra

      - name: Terraform targeted apply
        if: inputs.apply
        run: terraform apply -no-color tfplan
        working-directory: infra

      - name: Check next-api task definition drift
        if: inputs.apply
        id: next_api_task
        run: |
          set -euo pipefail
          current_task_definition="$(
            aws ecs describe-services \
              --cluster vayada-backend-cluster \
              --services vayada-next-api-service \
              --region "${AWS_REGION}" \
              --query 'services[0].taskDefinition' \
              --output text
          )"
          latest_task_definition="$(
            aws ecs describe-task-definition \
              --task-definition vayada-next-api \
              --region "${AWS_REGION}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"
          echo "current_task_definition=${current_task_definition}" >> "$GITHUB_OUTPUT"
          echo "latest_task_definition=${latest_task_definition}" >> "$GITHUB_OUTPUT"
          if [ "$current_task_definition" = "$latest_task_definition" ]; then
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_image="$(
            aws ecs describe-task-definition \
              --task-definition "$current_task_definition" \
              --region "${AWS_REGION}" \
              --query "taskDefinition.containerDefinitions[?name=='vayada-next-api'].image | [0]" \
              --output text
          )"
          echo "current_image=${current_image}" >> "$GITHUB_OUTPUT"
          echo "deploy_required=true" >> "$GITHUB_OUTPUT"

      - name: Download latest next-api task definition
        if: inputs.apply && steps.next_api_task.outputs.deploy_required == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.next_api_task.outputs.latest_task_definition }}" \
            --region "${AWS_REGION}" \
            --query taskDefinition > next-api-task-definition.json

      - name: Render next-api task definition with current image
        if: inputs.apply && steps.next_api_task.outputs.deploy_required == 'true'
        id: render-next-api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@6853cfae8c3a7d978fbf68b5a55453395541dfbb
        with:
          task-definition: next-api-task-definition.json
          container-name: vayada-next-api
          image: ${{ steps.next_api_task.outputs.current_image }}

      - name: Deploy latest next-api task definition
        if: inputs.apply && steps.next_api_task.outputs.deploy_required == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a310a830f5c14e583e35d84e4e1ec7dd177c3c9c
        with:
          task-definition: ${{ steps.render-next-api-task-def.outputs.task-definition }}
          service: vayada-next-api-service
          cluster: vayada-backend-cluster
          wait-for-service-stability: true
