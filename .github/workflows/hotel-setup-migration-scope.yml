name: Stage fixed NOLOGIN hotel setup migration group

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Reviewed operational image containing exact migration 0441
        required: true
      expected_task_definition:
        description: Exact stable held public API task
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-mutations
  queue: max
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Stage only the fixed NOLOGIN group after native failure proof
        env:
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: bash scripts/run-target-database-runtime-preflight.sh --stage-hotel-setup-migration-scope "$IMAGE_DIGEST"
