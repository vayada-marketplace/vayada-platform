name: Stage fixed NOLOGIN hotel setup migration group

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed migration parent to stage
        type: choice
        options: [property_0441, logo_0466, profile_0470]
        default: property_0441
      image_digest:
        description: Reviewed operational image containing the selected exact migration
        required: true
      expected_task_definition:
        description: Exact stable held public API task
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-mutations
  queue: max
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Stage only the fixed NOLOGIN parent through the reviewed blocked-caller gates
        env:
          SCOPE: ${{ inputs.scope }}
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          case "$SCOPE" in
            property_0441) mode=--stage-hotel-setup-migration-scope ;;
            logo_0466) mode=--stage-hotel-setup-logo-migration-scope ;;
            profile_0470) mode=--stage-hotel-setup-profile-migration-scope ;;
            *) exit 2 ;;
          esac
          bash scripts/run-target-database-runtime-preflight.sh "$mode" "$IMAGE_DIGEST"
