name: Release isolated hotel setup services and callers

on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [public, creation, property]
        required: true
      purpose:
        type: choice
        options: [creation, property, logo, profile]
        required: true
      state:
        type: choice
        options: [hold, blocked, enabled, start, stop, stop_failed_start, restore_initial]
        required: true
      image_digest:
        required: true
      expected_public_task:
        required: true
      private_task:
        description: "Reviewed task definition (required for start or property stop_failed_start; empty for stop)"

permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-mutations
  queue: max
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Validate and release only the reviewed service configuration
        env:
          SERVICE: ${{ inputs.service }}
          PURPOSE: ${{ inputs.purpose }}
          STATE: ${{ inputs.state }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_PUBLIC_TASK: ${{ inputs.expected_public_task }}
          PRIVATE_TASK: ${{ inputs.private_task }}
        run: |
          set -euo pipefail
          python3 scripts/release-hotel-setup.py --service "$SERVICE" --purpose "$PURPOSE" --state "$STATE" --image-digest "$IMAGE_DIGEST" --expected-public-task "$EXPECTED_PUBLIC_TASK" --private-task "$PRIVATE_TASK"
