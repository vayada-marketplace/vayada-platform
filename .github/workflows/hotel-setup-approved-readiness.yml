name: Backfill only approved legacy hotel readiness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply always inspects and freezes exact identities first in this job
        type: choice
        options: [inspect, apply, diagnose]
        default: inspect
        required: true
      image_digest:
        description: Reviewed approved-readiness operational digest with dual native proof
        required: true
      expected_task_definition:
        description: Exact stable public task retaining both blocked caller pairs
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ecs-mutations
  queue: max

jobs:
  approved-readiness:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Inspect or apply while both private services remain physically stopped
        env:
          MODE: ${{ inputs.mode }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/run-hotel-setup-approved-readiness.py --mode "$MODE" --image-digest "$IMAGE_DIGEST" --expected-public-task "$EXPECTED_TASK"
