name: Bootstrap exact hotel property command credential

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Reviewed dual-proof operational image digest
        required: true
      expected_task_definition:
        description: Reviewed stable public task with blocked property admission
        required: true
      property_id:
        description: Canonical existing property UUID
        required: true
      organization_id:
        description: Canonical owning organization UUID
        required: true
      actor_user_id:
        description: Original Owner actor UUID
        required: true
      operation:
        type: choice
        options: [launch_settings, currency, currency_ready, feature_hub, property_logo, property_profile]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ecs-mutations
  queue: max

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Require blocked caller and zero-task property service
        env:
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          PROPERTY_ID: ${{ inputs.property_id }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          ACTOR_USER_ID: ${{ inputs.actor_user_id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          bash scripts/run-target-database-runtime-preflight.sh --provision-hotel-setup-property-native "$PROPERTY_ID" "$ORGANIZATION_ID" "$ACTOR_USER_ID" "$OPERATION" "$IMAGE_DIGEST"
