name: VAY-2017 import immutable source snapshot

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed app source revision"
        required: true
      image_digest:
        description: "Reviewed immutable Next API digest"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ecs-mutations
  queue: max

jobs:
  authorize-import:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  verify-source:
    if: github.ref == 'refs/heads/main'
    needs: authorize-import
    environment: vay2042-data-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified-at: ${{ steps.verify.outputs.verified_at }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-vay2042-source-reader
          aws-region: eu-west-1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["rds:DescribeDBInstances","rds:DescribeDBSnapshots","cloudtrail:LookupEvents"],"Resource":"*"}]}
      - name: Verify immutable source restore
        id: verify
        run: |
          set -euo pipefail
          snapshot="$(aws rds describe-db-snapshots --db-snapshot-identifier vay2017-legacy-source-20260929 \
            --query 'DBSnapshots[0].{status:Status,source:DBInstanceIdentifier,encrypted:Encrypted,arn:DBSnapshotArn}' --output json)"
          jq -e '.status=="available" and .source=="vayada-database" and .encrypted==true and
            .arn=="arn:aws:rds:eu-west-1:269416271598:snapshot:vay2017-legacy-source-20260929"' <<<"$snapshot" >/dev/null

          instance="$(aws rds describe-db-instances --db-instance-identifier vay2017-source-import-20260929 \
            --query 'DBInstances[0].{status:DBInstanceStatus,public:PubliclyAccessible,multiAz:MultiAZ,encrypted:StorageEncrypted,endpoint:Endpoint.Address,resource:DbiResourceId,subnet:DBSubnetGroup.DBSubnetGroupName,vpc:DBSubnetGroup.VpcId,securityGroups:VpcSecurityGroups[].VpcSecurityGroupId,ca:CACertificateIdentifier}' --output json)"
          jq -e '.status=="available" and .public==false and .multiAz==false and .encrypted==true and
            .endpoint=="vay2017-source-import-20260929.c7eiqkoq4as4.eu-west-1.rds.amazonaws.com" and
            .resource=="db-NCBRBMYRRBMVWL7N4LB3AVYLHM" and .subnet=="default-vpc-055e8074dc3b2422a" and
            .vpc=="vpc-055e8074dc3b2422a" and .securityGroups==["sg-0089fc5e42fa33566"] and
            .ca=="rds-ca-rsa2048-g1"' <<<"$instance" >/dev/null

          restore_events="$(aws cloudtrail lookup-events --region eu-west-1 \
            --lookup-attributes AttributeKey=EventName,AttributeValue=RestoreDBInstanceFromDBSnapshot \
            --start-time 2026-09-29T00:00:00Z --query 'Events[*].CloudTrailEvent' --output json)"
          jq -e 'any(.[] | fromjson;
            .errorCode == null and .awsRegion == "eu-west-1" and .recipientAccountId == "269416271598" and
            .requestParameters.dBInstanceIdentifier == "vay2017-source-import-20260929" and
            (.requestParameters.dBSnapshotIdentifier == "vay2017-legacy-source-20260929" or
             .requestParameters.dBSnapshotIdentifier == "arn:aws:rds:eu-west-1:269416271598:snapshot:vay2017-legacy-source-20260929") and
            .responseElements.dbiResourceId == "db-NCBRBMYRRBMVWL7N4LB3AVYLHM")' <<<"$restore_events" >/dev/null
          printf 'verified_at=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

  import:
    if: github.ref == 'refs/heads/main'
    needs: verify-source
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Verify exact image and import credential
        id: verify
        env:
          SOURCE: ${{ inputs.source_sha }}
          DIGEST: ${{ inputs.image_digest }}
          VERIFIED_AT: ${{ needs.verify-source.outputs.verified-at }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_AT" =~ ^[0-9]+$ ]]
          now="$(date +%s)"
          (( now >= VERIFIED_AT && now - VERIFIED_AT <= 180 ))
          [[ "$SOURCE" == "f851a5b009aa71789a63cf1319d2248ffd2e9725" ]]
          [[ "$DIGEST" == "sha256:284f63ecb966e6a27eab1bc33d5ff370d7fd2ffb900f4c56b31c4b2c66976955" ]]
          grep -Fx -- "$SOURCE $DIGEST" scripts/next-api-split-compatible-images.txt
          aws ecr describe-images --repository-name vayada-next-api \
            --image-ids "imageDigest=$DIGEST" --region eu-west-1 >/dev/null

          parameter="$(aws ssm get-parameter --name /vayada/prod/vay2017-source-import-url \
            --query 'Parameter.{type:Type,version:Version}' --output json)"
          jq -e '.type=="SecureString" and .version==1' <<<"$parameter" >/dev/null
      - name: Prepare restricted source reader
        env:
          SOURCE: ${{ inputs.source_sha }}
          DIGEST: ${{ inputs.image_digest }}
        run: bash scripts/run-target-database-runtime-preflight.sh --import-vay2017-source-snapshot prepare "$DIGEST" "$SOURCE" vay1351-61ec013e79ed2a042caadef8 "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Extract exact source run
        env:
          SOURCE: ${{ inputs.source_sha }}
          DIGEST: ${{ inputs.image_digest }}
        run: bash scripts/run-target-database-runtime-preflight.sh --import-vay2017-source-snapshot extract "$DIGEST" "$SOURCE" vay1351-61ec013e79ed2a042caadef8 "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Disable and remove restricted source reader
        if: always() && steps.verify.outcome == 'success'
        env:
          SOURCE: ${{ inputs.source_sha }}
          DIGEST: ${{ inputs.image_digest }}
        run: bash scripts/run-target-database-runtime-preflight.sh --import-vay2017-source-snapshot cleanup "$DIGEST" "$SOURCE" vay1351-61ec013e79ed2a042caadef8 "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
