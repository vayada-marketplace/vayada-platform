name: Inspect or repair the existing property reader logo columns
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inspect, apply]
        required: true
      expected_manifest_sha256:
        description: Empty for inspection; exact PLAN fingerprint required for apply
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-mutations
  queue: max
jobs:
  cutover:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Inspect or apply only missing reviewed reader columns, then prove native startup
        env:
          EXPECTED_TASK: arn:aws:ecs:eu-west-1:269416271598:task-definition/vayada-next-api:1197
          IMAGE_DIGEST: sha256:18fa7587a09fa58916e734ea9c3b2d38c274783bc98d793308cc2f122d688965
          PHASE: ${{ inputs.phase }}
          FROZEN: ${{ inputs.expected_manifest_sha256 }}
          AWS_MAX_ATTEMPTS: "1"
          AWS_RETRY_MODE: standard
        run: |
          set -euo pipefail
          bash scripts/run-target-database-runtime-preflight.sh --repair-hotel-setup-logo-reader "$PHASE" "$FROZEN" "$IMAGE_DIGEST" | tee reader-cutover.json
          oid=$(jq -er '.roleOid' reader-cutover.json)
          if bash scripts/run-target-database-runtime-preflight.sh --repair-hotel-setup-logo-reader verify "$oid" "$IMAGE_DIGEST" > reader-native.json; then
            cat reader-native.json
          else
            cat reader-native.json
            [[ "$PHASE" == inspect ]] || exit 1
            jq -e '.=={status:"FAIL",scope:"hotel_setup_logo_reader_cutover",stage:"column_privileges",sqlState:null}' reader-native.json >/dev/null
            echo "Native reader confirms the inspected column mismatch; apply remains a separate dispatch."
          fi
