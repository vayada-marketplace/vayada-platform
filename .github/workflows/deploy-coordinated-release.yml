name: Deploy coordinated next release

on:
  repository_dispatch:
    types: [coordinated-release-published]
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile, resume, activate, or verify publication without deployment
        required: true
        type: choice
        options: [ordinary, resume, activate, verify]
        default: ordinary
      published_artifact_id:
        description: Exact non-expired published artifact ID from vayada
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the exact manifest.json bytes
        required: true
        type: string
      published_record_sha256:
        description: SHA-256 of the exact published-record.json bytes
        required: true
        type: string
      service:
        description: Physical service to resume (required only for resume; activate selects all)
        required: false
        type: choice
        options:
          - "none"
          - next-target-backend
          - next-pms-frontend
          - next-booking-frontend
          - next-booking-admin
          - next-marketplace-admin
        default: "none"

permissions:
  actions: read
  contents: read
  id-token: write

# This run-level lock remains owned while the API and all frontend matrix jobs
# execute, so Terraform and every other production ECS writer stay excluded.
concurrency:
  group: production-ecs-mutations
  queue: max

env:
  AWS_REGION: eu-west-1
  RELEASE_BUNDLE_ARTIFACT: coordinated-release-plan-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    name: Validate and plan full release
    outputs:
      attempt: ${{ steps.attempt.outputs.value }}
      auto_skip: ${{ steps.admission.outputs.auto_skip }}
    environment: next
    runs-on: ubuntu-latest
    steps:
      - name: Record preparation attempt
        id: attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-coordinated-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Capture dispatch envelope
        id: dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ["DISPATCH_JSON"])
          artifact_id = payload.get("publishedArtifactId")
          if isinstance(artifact_id, bool) or not isinstance(artifact_id, int) or artifact_id < 1:
              raise SystemExit("publishedArtifactId must be a positive integer")
          with open("dispatch.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"published_artifact_id={artifact_id}", file=output)
          PY

      - name: Validate publication, ancestry, state, barriers and live targets
        env:
          COORDINATED_RELEASE_READ_TOKEN: ${{ secrets.COORDINATED_RELEASE_READ_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ARTIFACT_ID: ${{ steps.dispatch.outputs.published_artifact_id }}
          INPUT_ARTIFACT_ID: ${{ inputs.published_artifact_id }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_RECORD_SHA256: ${{ inputs.published_record_sha256 }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          artifact_id="${EVENT_ARTIFACT_ID:-${INPUT_ARTIFACT_ID:-}}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          operation="${INPUT_OPERATION:-ordinary}"
          arguments=(
            --artifact-id "$artifact_id"
            --operation "$operation"
            --operation-id "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --output-dir release-bundle
          )
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            arguments+=(--dispatch-json dispatch.json)
          else
            arguments+=(
              --manifest-sha256 "$INPUT_MANIFEST_SHA256"
              --published-record-sha256 "$INPUT_RECORD_SHA256"
            )
          fi
          if [ "$operation" = resume ]; then
            test -n "$INPUT_SERVICE"
            arguments+=(--service "$INPUT_SERVICE")
          fi
          python3 scripts/coordinated_release.py prepare "${arguments[@]}"

      # Automatic events arrive before the reviewed admission PR lists the new API
      # image. Skip reconciliation instead of failing at the split launcher guard.
      # Manual dispatches never run this step, so they still fail hard there.
      - name: Check automatic API image admission
        id: admission
        if: github.event_name == 'repository_dispatch'
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location(
              "split_guard", "scripts/assert-next-api-split-compatible-image.py")
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          with open("release-bundle/manifest.json", encoding="utf-8") as handle:
              digest = json.load(handle)["services"]["next-target-backend"]["digest"]
          if not isinstance(digest, str) or not guard.DIGEST.fullmatch(digest):
              raise SystemExit("next-target-backend digest is invalid")
          admitted = guard.is_admitted(digest)
          if not admitted:
              with open("release-bundle/plan.json", encoding="utf-8") as handle:
                  plan = json.load(handle)
              message = (f"Image {digest} not admitted yet; skipping automatic deploy. "
                         "Admit it and dispatch operation=ordinary.")
              print(f"::notice title=Automatic deploy skipped::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  print(f"## Automatic deploy skipped\n\n{message}\n", file=summary)
                  for field in ("artifactId", "manifestSha256", "publishedRecordSha256"):
                      print(f"- `{field}`: `{plan[field]}`", file=summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"auto_skip={'false' if admitted else 'true'}", file=output)
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_BUNDLE_ARTIFACT }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 1

  api:
    name: Reconcile API and verify readiness
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && inputs.operation != 'verify' && needs.prepare.outputs.auto_skip != 'true' }}
    environment: next
    runs-on: ubuntu-latest
    steps:
      - name: Require preparation in this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Partial reruns cannot reuse a prior plan. Dispatch the exact published artifact again so preparation and API readiness run under the deployment lock."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_BUNDLE_ARTIFACT }}
          path: release-bundle
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-coordinated-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - run: >-
          python3 scripts/coordinated_release.py reconcile-service
          --manifest release-bundle/manifest.json
          --plan release-bundle/plan.json
          --service next-target-backend

  frontends:
    env:
      NEXT_BOOKING_CANARY_URL: ${{ vars.NEXT_BOOKING_CANARY_URL }}
      NEXT_BOOKING_CANARY_NAME: ${{ vars.NEXT_BOOKING_CANARY_NAME }}
    name: Reconcile ${{ matrix.service }}
    needs: [prepare, api]
    if: needs.api.result == 'success' && needs.prepare.outputs.auto_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - next-pms-frontend
          - next-booking-frontend
          - next-booking-admin
          - next-marketplace-admin
    environment: next
    runs-on: ubuntu-latest
    steps:
      - name: Require preparation in this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Partial reruns cannot reuse a prior plan. Dispatch the exact published artifact again so preparation and API readiness run under the deployment lock."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_BUNDLE_ARTIFACT }}
          path: release-bundle
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-coordinated-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - run: >-
          python3 scripts/coordinated_release.py reconcile-service
          --manifest release-bundle/manifest.json
          --plan release-bundle/plan.json
          --service '${{ matrix.service }}'

  finalize:
    name: Report per-service durable result
    needs: [prepare, api, frontends]
    if: always() && needs.prepare.result == 'success' && inputs.operation != 'verify' && needs.prepare.outputs.auto_skip != 'true'
    environment: next
    runs-on: ubuntu-latest
    steps:
      - name: Require preparation in this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Partial reruns cannot reuse a prior plan. Dispatch the exact published artifact again so preparation and API readiness run under the deployment lock."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_BUNDLE_ARTIFACT }}
          path: release-bundle
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-coordinated-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: >-
          python3 scripts/coordinated_release.py finalize
          --manifest release-bundle/manifest.json
          --plan release-bundle/plan.json

  # Automatic next-api image admission (VAY-2287), off until the repository variable
  # AUTO_ADMIT_NEXT_API_IMAGES is "true". An automatic event whose API image is not admitted yet
  # skipped reconciliation above. scripts/coordinated_auto_admission.py admits that image only
  # when its source commit passed a full, green merge-queue run of PR Checks, no app
  # release-train-hold is open, and neither a database migration nor the PR Checks definition
  # changed since the last admitted commit; then this job dispatches the ordinary deploy of the same publication, as an operator does
  # after an admission PR. A refused gate leaves the release for a manual admission, as before.
  admit:
    name: Admit the API image automatically
    needs: prepare
    if: github.event_name == 'repository_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.auto_skip == 'true' && vars.AUTO_ADMIT_NEXT_API_IMAGES == 'true'
    environment: next
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require preparation in this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Partial reruns cannot reuse a prior plan. Dispatch the exact published artifact again so preparation and API readiness run under the deployment lock."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_BUNDLE_ARTIFACT }}
          path: release-bundle
      - name: Check the admission gates
        id: gates
        env:
          COORDINATED_RELEASE_READ_TOKEN: ${{ secrets.COORDINATED_RELEASE_READ_TOKEN }}
        run: python3 scripts/coordinated_auto_admission.py check --bundle release-bundle
      - name: Admit the image on main
        if: steps.gates.outputs.admit == 'true'
        run: |
          set -euo pipefail
          sha=$(jq -r .sourceSha release-bundle/plan.json)
          digest=$(jq -r '.services["next-target-backend"].digest' release-bundle/manifest.json)
          lists=(scripts/next-api-split-compatible-images.txt scripts/next-api-ongoing-export-compatible-images.txt)
          # Every Terraform Validate suite that reads these lists, as on an admission PR.
          check_lists() {
            for list in "${lists[@]}"; do
              test "$(grep -cxF "$sha $digest" "$list")" = 1 || { echo "::error::$list must list $sha $digest once"; exit 1; }
            done
            python3 scripts/test-next-api-split-compatible-image.py
            python3 -m unittest scripts/test_coordinated_release.py
            python3 scripts/test-target-database-split-deployment-ready.py
            python3 scripts/test-finance-export-once.py
            node --test scripts/test-legacy-migration-oneoff.mjs
          }
          python3 scripts/coordinated_auto_admission.py append --bundle release-bundle
          check_lists
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "[VAY-2287] Admit next-${sha:0:9} to the next-api compatible-image lists" \
            -m "Automatic admission by deploy run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: full green merge-queue run, no release hold, no migration or test-coverage change." \
            "${lists[@]}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            # Someone pushed to main meanwhile: replay onto it and check the lists again.
            git pull --rebase origin main
            check_lists
          done
          echo "::error::Could not push the admission to main"
          exit 1
      - name: Dispatch the ordinary deploy of this publication
        if: steps.gates.outputs.admit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-coordinated-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=ordinary \
            -f published_artifact_id="$(jq -r .artifactId release-bundle/plan.json)" \
            -f manifest_sha256="$(jq -r .manifestSha256 release-bundle/plan.json)" \
            -f published_record_sha256="$(jq -r .publishedRecordSha256 release-bundle/plan.json)" \
            -f service=none
