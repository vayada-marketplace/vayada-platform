name: Rotate RDS Administrator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VAY-2038 to approve the production RDS administrator rotation"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-ecs-mutations
  queue: max

env:
  AWS_REGION: eu-west-1

jobs:
  rotate:
    name: Rotate protected administrator credential
    runs-on: ubuntu-latest
    steps:
      - name: Check explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "VAY-2038"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Install pinned AWS SDK
        run: python3 -m pip install --disable-pip-version-check boto3==1.42.14
      - name: Rotate RDS and restart its only runtime consumer
        run: python3 scripts/restore-rds-admin-from-ssm.py apply
