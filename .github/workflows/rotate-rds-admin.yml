name: Rotate RDS Administrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check logs in with the current password and changes nothing; apply rotates"
        type: choice
        options: [check, apply]
        default: check
        required: true
      confirmation:
        description: "For apply only: type VAY-2038 to approve the production RDS administrator rotation"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-ecs-mutations
  queue: max

env:
  AWS_REGION: eu-west-1

jobs:
  rotate:
    environment: platform-mutations-v2
    name: Rotate protected administrator credential
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed main workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Check explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = check || test "$CONFIRMATION" = "VAY-2038"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Install pinned AWS SDK
        run: python3 -m pip install --disable-pip-version-check boto3==1.42.14
      - name: Check, or rotate RDS, restart the legacy Marketplace API while it runs and prove the admin login
        env:
          MODE: ${{ inputs.mode }}
        run: python3 scripts/restore-rds-admin-from-ssm.py "$MODE"
