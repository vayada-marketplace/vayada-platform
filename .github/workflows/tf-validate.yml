name: Terraform Validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/roll-forward-auth-gateways.sh"
      - "scripts/smoke-auth-gateway.sh"
      - "scripts/smoke-next-booking-public.sh"
      - "scripts/run-stripe-connect-smoke.sh"
      - "scripts/stripe-connect-smoke.mjs"
      - "scripts/run-finance-folio-recipient-inventory.sh"
      - "scripts/finance-folio-recipient-inventory.mjs"
      - "scripts/assert-finance-folio-kms-contract.sh"
      - "scripts/bootstrap-finance-folio-kms.sh"
      - "scripts/test-bootstrap-finance-folio-kms.sh"
      - "scripts/assert-terraform-protected-resources.sh"
      - "scripts/test-finance-folio-kms-plan-guard.sh"
      - "scripts/guard-finance-folio-kms-plan.sh"
      - "scripts/test-finance-folio-kms-phase-guard.sh"
      - "scripts/fixtures/finance-folio-kms/**"
      - "docs/finance-folio-kms-steady-state-policy.template.json"
      - "docs/finance-folio-kms-fingerprint-steady-state-policy.template.json"
      - "scripts/validate-auth-gateway-contract.sh"
      - "scripts/check-migration-rehearsal-media.sh"
      - "scripts/test-migration-rehearsal-media.sh"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/tf-apply.yml"
      - ".github/workflows/tf-plan.yml"
      - ".github/workflows/tf-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate operations scripts
        run: |
          bash -n scripts/check-migration-rehearsal-media.sh
          bash scripts/test-migration-rehearsal-media.sh
          bash -n scripts/roll-forward-auth-gateways.sh
          bash -n scripts/validate-auth-gateway-contract.sh
          bash -n scripts/smoke-auth-gateway.sh
          bash -n scripts/smoke-next-booking-public.sh
          bash -n scripts/run-stripe-connect-smoke.sh
          node --check scripts/stripe-connect-smoke.mjs
          bash -n scripts/run-finance-folio-recipient-inventory.sh
          node --check scripts/finance-folio-recipient-inventory.mjs
          jq empty docs/finance-folio-kms-steady-state-policy.template.json
          jq empty docs/finance-folio-kms-fingerprint-steady-state-policy.template.json
          bash scripts/assert-finance-folio-kms-contract.sh
          bash -n scripts/bootstrap-finance-folio-kms.sh
          bash scripts/test-bootstrap-finance-folio-kms.sh
          bash scripts/test-finance-folio-kms-plan-guard.sh
          bash -n scripts/guard-finance-folio-kms-plan.sh
          bash scripts/test-finance-folio-kms-phase-guard.sh

      - name: Validate auth gateway contract
        run: bash scripts/validate-auth-gateway-contract.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Terraform validate
        run: terraform validate
        working-directory: infra

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
