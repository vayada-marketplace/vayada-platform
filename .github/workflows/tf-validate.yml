      - ".github/workflows/rotate-rds-admin.yml"
      - ".github/workflows/tf-plan.yml"
      - ".github/workflows/tf-validate.yml"
      - ".github/workflows/vay2017-metadata-inventory.yml"
      - ".github/workflows/vay2017-metadata-reader-bootstrap.yml"

permissions:
  contents: read

jobs:
  identity-runtime-grant:
    name: Identity runtime grant (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16", "17"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify scoped identity grants and denials
        run: bash scripts/test-target-database-identity-runtime-grant.sh "${{ matrix.postgres }}"

  target-database-cluster-acl:
    name: Cluster database ACL (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16", "17"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify sibling database isolation
        run: bash scripts/test-target-database-cluster-acl.sh "${{ matrix.postgres }}"

  target-database-runtime-preflight:
    name: Runtime database preflight (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16", "17"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Exercise database role and ACL guard
        run: bash scripts/test-target-database-runtime-preflight-integration.sh "${{ matrix.postgres }}"

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate operations scripts
        run: |
          python3 -m unittest scripts/test_platform_writer_boundary.py -v
          python3 -m py_compile scripts/coordinated_release.py
          python3 -m unittest scripts/test_coordinated_release.py -v
          python3 -m unittest scripts/test_coordinated_recovery.py -v
          bash -n scripts/check-migration-rehearsal-media.sh
          bash scripts/test-migration-rehearsal-media.sh
          node --check scripts/migration-rehearsal-reader-contract.mjs
          node scripts/test-migration-rehearsal-reader-contract.mjs
          node --check scripts/migration-rehearsal-reader.mjs
          node scripts/test-migration-rehearsal-reader.mjs
          node --check scripts/migration-rehearsal-app-readonly.mjs
          node scripts/test-migration-rehearsal-app-readonly.mjs
          node --check scripts/migration-rehearsal-reader-renewal.mjs
          node scripts/test-migration-rehearsal-reader-renewal.mjs
          node --check scripts/migration-rehearsal-identity-readiness.mjs
          node scripts/test-migration-rehearsal-identity-readiness.mjs
          node --check scripts/migration-rehearsal-temporary-admin.mjs
          node scripts/test-migration-rehearsal-temporary-admin.mjs
          node --check scripts/migration-rehearsal-public-media.mjs
          node scripts/test-migration-rehearsal-public-media.mjs
          node --check scripts/migration-rehearsal-positive-public-media-object.mjs
          node scripts/test-migration-rehearsal-positive-public-media-object.mjs
          node --check scripts/migration-rehearsal-positive-public.mjs
          node scripts/test-migration-rehearsal-positive-public.mjs
          node scripts/test-migration-rehearsal-application.mjs
          node --check scripts/migration-rehearsal-task-images.mjs
          node --check scripts/migration-rehearsal-browser.mjs
          node --check scripts/migration-rehearsal-browser-runner.mjs
          node scripts/test-migration-rehearsal-browser.mjs
          bash -n scripts/roll-forward-auth-gateways.sh
          bash -n scripts/validate-auth-gateway-contract.sh
          bash -n scripts/smoke-auth-gateway.sh
          bash -n scripts/smoke-next-booking-public.sh
          bash -n scripts/run-stripe-connect-smoke.sh
          node --check scripts/stripe-connect-smoke.mjs
          bash -n scripts/run-finance-folio-recipient-inventory.sh
          node --check scripts/finance-folio-recipient-inventory.mjs
          jq empty docs/finance-folio-kms-steady-state-policy.template.json
          jq empty docs/finance-folio-kms-fingerprint-steady-state-policy.template.json
          bash scripts/assert-finance-folio-kms-contract.sh
          bash -n scripts/bootstrap-finance-folio-kms.sh
          bash scripts/test-bootstrap-finance-folio-kms.sh
          python3 scripts/test-target-database-credential-split.py
          python3 scripts/test-target-database-split-deployment-ready.py
          bash -n scripts/run-target-database-runtime-preflight.sh
          node --check scripts/target-database-runtime-preflight.mjs
          node --check scripts/financials-activation-readiness.mjs
          node --check scripts/grant-target-database-product-audit-insert.mjs
          node --check scripts/finance-expense-worker-database.mjs
          node --check scripts/finance-export-worker-database.mjs
          node --check scripts/grant-target-database-identity-runtime.mjs
          node --check scripts/provision-target-database-identity-runtime.mjs
          node --check scripts/inspect-target-database-cluster-acl.mjs
          node --check scripts/harden-target-database-cluster-acl.mjs
          python3 -m unittest scripts/test_restore_rds_admin_from_ssm.py
          node --check scripts/inspect-target-database-identity-role.mjs
          bash -n scripts/test-target-database-identity-runtime-grant.sh
          bash -n scripts/test-target-database-cluster-acl.sh
          python3 scripts/test-target-database-identity-secret.py
          python3 scripts/test-target-database-runtime-preflight.py
          python3 scripts/test-target-database-runtime-runner.py
          python3 scripts/test-channex-worker-database.py
          python3 scripts/test-pause-next-api-channex-worker.py
          python3 scripts/test-next-api-split-compatible-image.py
          python3 scripts/test-finance-export-once.py
          bash scripts/test-finance-folio-kms-plan-guard.sh
          bash -n scripts/guard-finance-folio-kms-plan.sh
          bash scripts/test-finance-folio-kms-phase-guard.sh
          node scripts/test-marketplace-communication-unsubscribe-keys.mjs
          node --check scripts/vay2017-rehearsal-metadata.mjs
          node --test scripts/test-vay2017-rehearsal-metadata.mjs
          node --test scripts/test-vay2042-source-catalog.mjs
          node --check scripts/provision-vay2017-metadata-reader.mjs
          node --test scripts/test-vay2017-metadata-reader-provisioner.mjs
          node --test scripts/test-vay2017-metadata-reader-infra.mjs
          node --test scripts/test-vay2017-metadata-reader-bootstrap.mjs
          node --test scripts/test-vay2042-source-reader-runner.mjs
          node --test scripts/test-vay2042-target-runner.mjs
          node --test scripts/test-vay2042-media-infra.mjs
          bash -n scripts/run-vay2017-rehearsal-metadata.sh
          bash -n scripts/run-vay2017-metadata-reader-bootstrap.sh
          bash -n scripts/check-vay2017-rehearsal-isolation.sh
          jq empty scripts/fixtures/vay2017-restore-attestation.json
          jq empty scripts/fixtures/vay2017-isolated-restore-plan.json

      - name: Validate auth gateway contract
        run: bash scripts/validate-auth-gateway-contract.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Terraform validate
        run: terraform validate
        working-directory: infra

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Initialize isolated VAY-2043 Terraform root without backend
        run: terraform init -backend=false
        working-directory: infra/vay2017-metadata-runner

      - name: Validate isolated VAY-2043 Terraform root
        run: terraform validate
        working-directory: infra/vay2017-metadata-runner
