name: Terraform Validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/smoke-auth-gateway.sh"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/tf-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate auth gateway smoke script
        run: |
          bash -n scripts/validate-auth-gateway-contract.sh
          bash -n scripts/smoke-auth-gateway.sh

      - name: Validate auth gateway contract
        run: bash scripts/validate-auth-gateway-contract.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Terraform validate
        run: terraform validate
        working-directory: infra

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
