      - "scripts/test-migration-rehearsal-positive-public.mjs"
      - "scripts/check-migration-rehearsal-application.mjs"
      - "scripts/test-migration-rehearsal-application.mjs"
      - "scripts/migration-rehearsal-task-images.mjs"
      - "scripts/migration-rehearsal-browser.mjs"
      - "scripts/migration-rehearsal-browser-runner.mjs"
      - "scripts/test-migration-rehearsal-browser.mjs"
