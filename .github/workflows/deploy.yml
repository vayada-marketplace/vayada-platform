name: Deploy App Service

on:
  repository_dispatch:
    types: [app-image-published]
  workflow_dispatch:
    inputs:
      service:
        description: "Service key (e.g. affiliate-dashboard)"
        required: true
      ecr_repo:
        description: "ECR repository name (e.g. vayada-affiliate-dashboard)"
        required: true
      image_sha:
        description: "Full 40-char git SHA of the image to deploy"
        required: true
      source_sha:
        description: "Optional source Git SHA exposed by the application health route"
        required: false
      image_digest:
        description: "Optional sha256 digest captured by the publishing workflow"
        required: false
      rollback_image:
        description: "Optional image URI to deploy automatically if cutover fails"
        required: false
      channex_staging:
        description: "Enable synthetic-property restrictions only (requires scoped-worker image)"
        required: false
        type: boolean
        default: false
      channex_staging_meals:
        description: "Also process scoped meal jobs (requires reviewed meal-worker image)"
        required: false
        type: boolean
        default: false
      channex_staging_inventory:
        description: "Also process scoped inventory-rule jobs (requires reviewed inventory-worker image)"
        required: false
        type: boolean
        default: false
      room_closure:
        description: "Enable room closure on the already-paused synthetic canary"
        required: false
        type: boolean
        default: false
      channex_staging_no_show:
        description: "Enable property-scoped no-show reporting (requires reviewed no-show image)"
        required: false
        type: boolean
        default: false
      channex_staging_alerts:
        description: "Enable authenticated receipt-only staging alert receiver"
        required: false
        type: boolean
        default: false
      channex_worker_state:
        description: "Preserve worker state, or pause/resume on the current canary image"
        required: false
        type: choice
        options: [preserve, paused, running]
        default: preserve
      activate_guest:
        description: "Blocked: guest activation awaits current active-publication verification"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        required: true
        default: production
      adaptive_onboarding:
        description: "Next Marketplace adaptive onboarding runtime flag"
        type: choice
        options: [preserve, enabled, disabled]
        default: preserve

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ (inputs.service == 'next-maps-canary' || inputs.service == 'next-maps-canary-remove' || inputs.service == 'next-maps-guest' || inputs.service == 'next-maps-frontends' || inputs.service == 'next-maps-frontends-remove') && 'vay1480-staging-canary' || 'production-ecs-mutations' }}
  queue: max

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: 269416271598
  ECS_CLUSTER: vayada-backend-cluster

jobs:
  deploy:
    if: (github.event.client_payload.service || inputs.service) != 'next-maps-canary' && (github.event.client_payload.service || inputs.service) != 'next-maps-canary-remove' && (github.event.client_payload.service || inputs.service) != 'next-maps-guest' && (github.event.client_payload.service || inputs.service) != 'next-maps-frontends' && (github.event.client_payload.service || inputs.service) != 'next-maps-frontends-remove'
    name: Deploy ${{ github.event.client_payload.service || inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate adaptive onboarding scope
        env:
          ADAPTIVE_ONBOARDING: ${{ inputs.adaptive_onboarding }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/set-adaptive-onboarding.py --validate-only

      - name: Validate Channex worker state scope
        env:
          ROOM_CLOSURE: ${{ inputs.room_closure }}
          CHANNEX_WORKER_STATE: ${{ inputs.channex_worker_state }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEX_STAGING: ${{ inputs.channex_staging }}
          ACTIVATE_GUEST: ${{ inputs.activate_guest }}
        run: bash scripts/validate-channex-worker-state.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECS service and task family
        id: resolve
        run: |
          SERVICE="${{ github.event.client_payload.service || inputs.service }}"
          case "$SERVICE" in
            booking-backend)
              echo "ecs_service=vayada-booking-backend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-booking-backend" >> "$GITHUB_OUTPUT"
              ;;
            booking-frontend)
              echo "ecs_service=vayada-booking-frontend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-booking-frontend" >> "$GITHUB_OUTPUT"
              ;;
            booking-admin)
              echo "ecs_service=vayada-booking-admin-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-booking-admin" >> "$GITHUB_OUTPUT"
              ;;
            pms-backend)
              echo "ecs_service=vayada-pms-backend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-pms-backend" >> "$GITHUB_OUTPUT"
              ;;
            pms-frontend)
              echo "ecs_service=vayada-pms-frontend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-pms-frontend" >> "$GITHUB_OUTPUT"
              ;;
            marketplace-backend)
              echo "ecs_service=vayada-marketplace-backend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-marketplace-backend" >> "$GITHUB_OUTPUT"
              ;;
            marketplace-admin)
              echo "ecs_service=vayada-marketplace-admin-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-marketplace-admin" >> "$GITHUB_OUTPUT"
              ;;
            affiliate-dashboard)
              echo "ecs_service=vayada-affiliate-dashboard-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-affiliate-dashboard" >> "$GITHUB_OUTPUT"
              ;;
            next-target-backend)
              echo "ecs_service=vayada-next-api-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-api" >> "$GITHUB_OUTPUT"
              ;;
            next-pms-frontend)
              echo "ecs_service=vayada-next-pms-frontend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-pms-frontend" >> "$GITHUB_OUTPUT"
              ;;
            next-booking-frontend)
              echo "ecs_service=vayada-next-booking-frontend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-booking-frontend" >> "$GITHUB_OUTPUT"
              ;;
            next-booking-admin)
              echo "ecs_service=vayada-next-booking-admin-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-booking-admin" >> "$GITHUB_OUTPUT"
              ;;
            next-marketplace-admin)
              echo "ecs_service=vayada-next-marketplace-admin-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-marketplace-admin" >> "$GITHUB_OUTPUT"
              ;;
            next-marketplace-frontend)
              echo "ecs_service=vayada-next-marketplace-frontend-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-marketplace-frontend" >> "$GITHUB_OUTPUT"
              ;;
            next-affiliate-dashboard)
              echo "ecs_service=vayada-next-affiliate-dashboard-service" >> "$GITHUB_OUTPUT"
              echo "task_family=vayada-next-affiliate-dashboard" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

      - name: Download current task definition
        run: |
          set -euo pipefail
          current_task_definition="$(
            aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "${{ steps.resolve.outputs.ecs_service }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].taskDefinition' \
              --output text
          )"
          expected_prefix="arn:aws:ecs:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:task-definition/${{ steps.resolve.outputs.task_family }}:"
          if [[ "$current_task_definition" != "${expected_prefix}"* ]]; then
            echo "::error::ECS did not return the deployed task definition for ${{ steps.resolve.outputs.ecs_service }}."
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --region "${{ env.AWS_REGION }}" \
            --query taskDefinition > task-definition.json

      - name: Resolve and verify image digest in ECR
        id: resolve-image
        env:
          ECR_REPOSITORY: ${{ github.event.client_payload.ecr_repo || inputs.ecr_repo }}
          IMAGE_TAG: ${{ github.event.client_payload.image_sha || inputs.image_sha }}
          IMAGE_DIGEST: ${{ github.event.client_payload.image_digest || inputs.image_digest }}
        run: |
          set -euo pipefail
          if [ "${#IMAGE_TAG}" -gt 128 ] || [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Image tag is invalid."
            exit 1
          fi

          if [ -n "$IMAGE_DIGEST" ]; then
            if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid image digest '$IMAGE_DIGEST'."
              exit 1
            fi

            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG,imageDigest=$IMAGE_DIGEST" \
              --region "${{ env.AWS_REGION }}" \
              --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,tags:imageTags}' \
              --output json
          else
            IMAGE_DIGEST="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids "imageTag=$IMAGE_TAG" \
                --region "${{ env.AWS_REGION }}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ECR did not return a valid image digest."
            exit 1
          fi

          registry="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "- Deploy image: ${image_uri}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve and verify rollback image
        id: resolve-rollback
        env:
          ECR_REPOSITORY: ${{ github.event.client_payload.ecr_repo || inputs.ecr_repo }}
          ROLLBACK_IMAGE: ${{ github.event.client_payload.rollback_image || inputs.rollback_image }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          TASK_FAMILY: ${{ steps.resolve.outputs.task_family }}
        run: |
          set -euo pipefail
          if [ -z "$ROLLBACK_IMAGE" ] && { [ "$SERVICE" = "next-booking-frontend" ] || [ "$SERVICE" = "next-marketplace-frontend" ]; }; then
            ROLLBACK_IMAGE="$(
              jq -r --arg name "$TASK_FAMILY" \
                '.containerDefinitions[] | select(.name == $name) | .image // empty' \
                task-definition.json
            )"
          fi
          if [ -z "$ROLLBACK_IMAGE" ]; then
            if [ "$SERVICE" = "next-booking-frontend" ] || [ "$SERVICE" = "next-marketplace-frontend" ]; then
              echo "::error::Could not resolve the pre-cutover image for rollback."
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          registry="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          repository_uri="${registry}/${ECR_REPOSITORY}"
          case "$ROLLBACK_IMAGE" in
            "${repository_uri}:"*)
              rollback_tag="${ROLLBACK_IMAGE#"${repository_uri}:"}"
              if [ "${#rollback_tag}" -gt 128 ] || [[ ! "$rollback_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
                echo "::error::Rollback image tag is invalid."
                exit 1
              fi
              rollback_digest="$(
                aws ecr describe-images \
                  --repository-name "$ECR_REPOSITORY" \
                  --image-ids "imageTag=$rollback_tag" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'imageDetails[0].imageDigest' \
                  --output text
              )"
              ;;
            "${repository_uri}@"*)
              rollback_digest="${ROLLBACK_IMAGE#"${repository_uri}@"}"
              if [[ ! "$rollback_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "::error::Rollback image digest is invalid."
                exit 1
              fi
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids "imageDigest=$rollback_digest" \
                --region "${{ env.AWS_REGION }}" \
                --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,tags:imageTags}' \
                --output json
              ;;
            *)
              echo "::error::Rollback image must reference the deployment ECR repository."
              exit 1
              ;;
          esac

          if [[ ! "$rollback_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ECR did not return a valid rollback image digest."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "image_uri=${repository_uri}@${rollback_digest}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "- Rollback image: ${repository_uri}@${rollback_digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Render task definition with SHA-pinned image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.resolve.outputs.task_family }}
          image: ${{ steps.resolve-image.outputs.image_uri }}

      - name: Render rollback task definition
        if: steps.resolve-rollback.outputs.available == 'true'
        id: render-rollback-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.resolve.outputs.task_family }}
          image: ${{ steps.resolve-rollback.outputs.image_uri }}

      - name: Set adaptive onboarding on deployment task
        env:
          ADAPTIVE_ONBOARDING: ${{ inputs.adaptive_onboarding }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
          TASK_DEFINITION: ${{ steps.render-task-def.outputs.task-definition }}
          CURRENT_TASK_DEFINITION: task-definition.json
        run: python3 scripts/set-adaptive-onboarding.py

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.resolve.outputs.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test auth gateway
        id: auth-gateway-smoke
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
        run: bash scripts/smoke-auth-gateway.sh "$SERVICE"

      - name: Smoke test public Booking tenant
        id: booking-public-smoke
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          EXPECTED_BUILD_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha || github.event.client_payload.image_sha || inputs.image_sha }}
          NEXT_BOOKING_CANARY_URL: ${{ vars.NEXT_BOOKING_CANARY_URL }}
          NEXT_BOOKING_CANARY_NAME: ${{ vars.NEXT_BOOKING_CANARY_NAME }}
        run: bash scripts/smoke-next-booking-public.sh "$SERVICE"

      - name: Roll back failed ECS cutover
        if: failure() && steps.resolve-rollback.outputs.available == 'true' && (steps.deploy.outcome == 'failure' || steps.auth-gateway-smoke.outcome == 'failure' || steps.booking-public-smoke.outcome == 'failure')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-rollback-task-def.outputs.task-definition }}
          service: ${{ steps.resolve.outputs.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  maps-canary:
    environment: next
    if: github.event_name == 'workflow_dispatch' && (inputs.service == 'next-maps-canary' || inputs.service == 'next-maps-canary-remove' || inputs.service == 'next-maps-guest' || inputs.service == 'next-maps-frontends' || inputs.service == 'next-maps-frontends-remove')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Channex worker state scope
        env:
          ROOM_CLOSURE: ${{ inputs.room_closure }}
          CHANNEX_WORKER_STATE: ${{ inputs.channex_worker_state }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEX_STAGING: ${{ inputs.channex_staging }}
          ACTIVATE_GUEST: ${{ inputs.activate_guest }}
        run: bash scripts/validate-channex-worker-state.sh

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Deploy test-hotel staging API
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTIVATE_GUEST: ${{ inputs.activate_guest }}
          CHANNEX_STAGING: ${{ inputs.channex_staging }}
          CHANNEX_STAGING_MEALS: ${{ inputs.channex_staging_meals }}
          CHANNEX_STAGING_INVENTORY: ${{ inputs.channex_staging_inventory }}
          ROOM_CLOSURE: ${{ inputs.room_closure }}
          CHANNEX_STAGING_ALERTS: ${{ inputs.channex_staging_alerts }}
          CHANNEX_STAGING_NO_SHOW: ${{ inputs.channex_staging_no_show }}
          CHANNEX_WORKER_STATE: ${{ inputs.channex_worker_state }}
        run: |
          set -euo pipefail
          test "$ENVIRONMENT" = next
          if [ "${CHANNEX_WORKER_STATE:-preserve}" != preserve ]; then test "$SERVICE" = next-maps-canary; fi
          if [ "$SERVICE" = next-maps-guest ]; then python3 scripts/deploy-next-maps-frontends.py --guest-image-sha "$IMAGE_SHA" --guest-image-digest "$IMAGE_DIGEST"; exit 0; fi
          if [ "$SERVICE" = next-maps-frontends ]; then python3 scripts/deploy-next-maps-frontends.py; exit 0; fi
          if [ "$SERVICE" = next-maps-frontends-remove ]; then python3 scripts/deploy-next-maps-frontends.py --remove; exit 0; fi
          args=(--image-sha "$IMAGE_SHA" --channex-worker-state "${CHANNEX_WORKER_STATE:-preserve}")
          if [ "$CHANNEX_STAGING" = true ]; then args+=(--channex-staging); fi
          if [ "$CHANNEX_STAGING_MEALS" = true ]; then args+=(--channex-staging-meals); fi
          if [ "$CHANNEX_STAGING_INVENTORY" = true ]; then args+=(--channex-staging-inventory); fi
          if [ "$ROOM_CLOSURE" = true ]; then args+=(--room-closure); fi
          if [ "$CHANNEX_STAGING_ALERTS" = true ]; then args+=(--channex-staging-alerts); fi
          if [ "$CHANNEX_STAGING_NO_SHOW" = true ]; then args+=(--channex-staging-no-show); fi
          if [ "$SERVICE" = next-maps-canary-remove ]; then args+=(--remove); fi
          if [ "$ACTIVATE_GUEST" = true ]; then args+=(--activate-guest); fi
          python3 scripts/deploy-next-maps-canary.py "${args[@]}"
