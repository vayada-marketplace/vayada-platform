name: Read canonical hotel setup Owner identifiers

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: Reported account email for read-only canonical identifier lookup
        required: true
      image_digest:
        description: Reviewed operational image digest
        required: true
      expected_task_definition:
        description: Reviewed stable public task with blocked property admission
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ecs-mutations
  queue: max

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    environment: platform-mutations-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-platform-deploy
          aws-region: eu-west-1
      - name: Read identifiers without changing account or property state
        env:
          EXPECTED_TASK: ${{ inputs.expected_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          OWNER_EMAIL: ${{ inputs.owner_email }}
        run: |
          set -euo pipefail
          bash scripts/run-target-database-runtime-preflight.sh --audit-hotel-setup-owner "$OWNER_EMAIL" "$IMAGE_DIGEST"
